name: Docs

# Wires up the audit scripts. All five exit non-zero on a failure, so they
# were always meant to gate — they just had nothing calling them except a
# human remembering to.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: docs audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The H1 exemption for .github/ templates was a prefix test, which
      # also swallowed names like pull_request_template.md.backup.md.
      # These cases assert the boundary rather than describing it.
      - name: Link audit self-test
        run: python3 tools/link_audit.py --self-test

      # Every relative link resolves, and every file carries an H1.
      - name: Link audit
        run: python3 tools/link_audit.py

      # Every pipe table has a header, and header/separator/rows agree on
      # column count. This is what caught the five protocol INDEX.md files
      # whose headers were clobbered by a bulk edit.
      - name: Table audit
        run: python3 tools/table_audit.py

      # Every section INDEX.md is titled "<Layer> — <Section>" with the H1
      # first in the file and no frontmatter. All three faults arrived via
      # bulk edits, which is why this is a script and not a convention.
      - name: Title audit
        run: python3 tools/title_audit.py

      # Diagrams are the codex's only illustration, and the failure mode is
      # silent: box characters outside a fence render proportional and the
      # drawing collapses. Also holds every layer README to having one.
      # The fence rules have been wrong twice, both times found by review
      # rather than by running anything. These cases assert them directly.
      - name: Diagram audit self-test
        run: python3 tools/diagram_audit.py --self-test

      - name: Diagram audit
        run: python3 tools/diagram_audit.py

      # The numbers README quotes about itself — file, link, index and
      # diagram counts. They drifted because nothing checked them: the
      # diagram count sat at 101 against a real 102. A claim this cannot
      # find fails the same as a claim that is wrong, so rewording the
      # README turns the build red instead of quietly retiring the check.
      - name: Stats audit
        run: python3 tools/stats_audit.py
