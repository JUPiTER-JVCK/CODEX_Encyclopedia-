name: LMS

# Builds CORE and drives it through a real browser. The smoke test is the
# one that matters: it asserts progress survives a reload, which is the bug
# that made the app silently forget everything outside a Claude artifact.

on:
  pull_request:
    paths:
      - "Codex_LMS/**"
      - ".github/workflows/lms.yml"
  push:
    branches: [main]
    paths:
      - "Codex_LMS/**"
      - ".github/workflows/lms.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lms-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Codex_LMS

jobs:
  build:
    name: build + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Codex_LMS/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Serve and smoke test
        run: |
          npm run preview -- --port 4173 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:4173/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:4173/ || {
            echo "preview server never came up"; exit 1;
          }
          npm run smoke -- http://localhost:4173/
